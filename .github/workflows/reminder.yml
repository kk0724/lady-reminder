name: 给女友的每日提醒 ❤️

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 9:00 AM (中国时间)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Python script
      - name: Run the script
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}  # 从 GitHub Secrets 中获取
          CITY: ${{ secrets.CITY }}                      # 从 GitHub Variables 中获取城市（Weifang）
          TZ: ${{ secrets.TZ }}                          # 从 GitHub Variables 中获取时区（Asia/Shanghai）
        run: |
          python say_to_lady.py
