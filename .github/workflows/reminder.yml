name: 给女友的每日提醒 ❤️

on:
  schedule:
    # 日本时间（JST）
    # 早安 08:30
    - cron: "30 23 * * *"
    # 午饭 12:10
    - cron: "10 3 * * *"
    # 下午 16:30
    - cron: "30 7 * * *"
    # 晚安 22:30
    - cron: "30 13 * * *"

  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: 运行脚本
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python say_to_lady.py
