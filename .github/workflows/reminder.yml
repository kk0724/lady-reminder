name: 给女友的每日提醒 ❤️

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 09:00 JST
  workflow_dispatch: {}


jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: 运行脚本
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python say_to_lady.py
