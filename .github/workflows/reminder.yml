name: 给女友的每日提醒 ❤️

on:
  schedule:
    - cron: "23 0 * * *"   # 每天 8:00 AM (中国时间)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Python script with environment variables explicitly passed
      - name: Run the script
        env:
          SERVERCHAN_KEY1: ${{ secrets.SERVERCHAN_KEY1 }}  # 从 GitHub Secrets 中获取第一个微信的 SendKey
          SERVERCHAN_KEY2: ${{ secrets.SERVERCHAN_KEY2 }}  # 从 GitHub Secrets 中获取第二个微信的 SendKey
          CITY: ${{ vars.CITY }}                          # 从 GitHub Variables 中获取城市（如 Weifang）
          TZ: ${{ vars.TZ }}                              # 从 GitHub Variables 中获取时区（如 Asia/Shanghai）
          HEFENG_API_KEY: ${{ secrets.HEFENG_API_KEY }}    # 从 GitHub Secrets 中获取 HEFENG API Key
        run: |
          echo "CITY = $CITY"
          echo "TZ = $TZ"
          echo "HEFENG_API_KEY = $HEFENG_API_KEY"  # 打印 HEFENG_API_KEY 来验证
          python say_to_lady.py  # 运行您的 Python 脚本
